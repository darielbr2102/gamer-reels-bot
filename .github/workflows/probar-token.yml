name: Probar token
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          T=$(printf '%s' "$IG_ACCESS_TOKEN" | tr -d " \r\n\"'")
          I=$(printf '%s' "$IG_USER_ID" | tr -d " \r\n\"'")
          echo "Largo token: ${#T} | Largo ID: ${#I} | Empieza: ${T:0:3}"
          G=https://graph.facebook.com/v25.0
          echo "--- 1. quien es el token"; curl -s "$G/me?fields=id,name&access_token=$T"; echo
          echo "--- 2. permisos"; curl -s "$G/me/permissions?access_token=$T"; echo
          echo "--- 3. paginas"; curl -s "$G/me/accounts?access_token=$T"; echo
          echo "--- 4. negocios"; curl -s "$G/me/businesses?access_token=$T"; echo
          echo "--- 5. cuenta de IG por ID"; curl -s "$G/$I?fields=id,username&access_token=$T"; echo
